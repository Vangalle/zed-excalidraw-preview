name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - run: npm audit
      - run: npm run package:runtime

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path zed-extension/Cargo.toml --check
      - run: cargo test --locked --manifest-path zed-extension/Cargo.toml
      - run: cargo clippy --locked --manifest-path zed-extension/Cargo.toml -- -D warnings
      - run: cargo build --locked --manifest-path zed-extension/Cargo.toml --target wasm32-wasip2 --release
